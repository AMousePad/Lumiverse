[package]
name = "lumiverse-tray"
version = "0.2.4"
description = "Experimental Tauri-powered Lumiverse integrated browser and tray"
edition = "2021"
license-file = "../../LICENSE.md"

[lib]
name = "lumiverse_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
notify-rust = "4.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSData", "NSString", "std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKPreferences", "WKWebViewConfiguration", "std"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
