name: Complete Private Linux Desktop Release

on:
  workflow_run:
    workflows: [Build Desktop, Nightly Bundled Desktop Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run:
        description: Original public nightly workflow run
        required: true
        type: string
      source_attempt:
        description: Original workflow run attempt
        required: true
        type: string

permissions:
  contents: write
  actions: read

# Serialize signing/publication from both completion events. The publication
# policy independently refuses incomplete, mismatched or older release feeds.
concurrency:
  group: desktop-nightly-completion
  cancel-in-progress: false

jobs:
  complete:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_dispatch' &&
       contains(fromJSON('["main","staging"]'), github.event.workflow_run.head_branch))
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run || github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ inputs.source_attempt || github.event.workflow_run.run_attempt }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LUMIVERSE_UPDATER_PUBLIC_KEY: ${{ vars.LUMIVERSE_UPDATER_PUBLIC_KEY || secrets.LUMIVERSE_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Validate original request and private build identity
        id: resolve
        env:
          LINUX_RELEASE_BRIDGE_TOKEN: ${{ secrets.LINUX_RELEASE_BRIDGE_TOKEN }}
        run: bun scripts/private-linux-release.ts resolve
      - name: Download the successful private build
        if: steps.resolve.outputs.ready == 'true'
        uses: actions/download-artifact@v7
        with:
          repository: prolix-oc/Lumiverse-Builds
          run-id: ${{ steps.resolve.outputs.builder_run }}
          name: ${{ steps.resolve.outputs.artifact }}
          github-token: ${{ secrets.LINUX_RELEASE_BRIDGE_TOKEN }}
          path: linux-artifacts
      - name: Check out the exact release source
        if: steps.resolve.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.source }}
          path: source
          persist-credentials: false
      - name: Verify checksums, source, version, architecture and runtime provenance
        if: steps.resolve.outputs.ready == 'true'
        run: bun scripts/private-linux-release.ts stage
      - name: Install signing CLI dependencies
        if: steps.resolve.outputs.ready == 'true'
        run: bun install --cwd source/desktop --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        if: steps.resolve.outputs.ready == 'true'
      - name: Sign, independently verify, and upload both Linux platforms
        if: steps.resolve.outputs.ready == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            bundle="source/desktop/src-tauri/target/$target/release/bundle"
            mapfile -d '' images < <(find "$bundle/appimage" -maxdepth 1 -type f -name '*.AppImage' -print0)
            test "${#images[@]}" = 1
            bun run --cwd source/desktop tauri signer sign "${GITHUB_WORKSPACE}/${images[0]}"
            cargo run --locked --release --manifest-path source/desktop/tools/verify-updater/Cargo.toml -- "$bundle"
            if [[ "$target" == x86_64* ]]; then platform=linux-x86_64; else platform=linux-aarch64; fi
            DESKTOP_PLATFORM="$platform" DESKTOP_TARGET="$target" bun source/scripts/publish-desktop-release.ts upload
          done
      - name: Advance the channel only after every platform succeeds
        if: steps.resolve.outputs.ready == 'true' || steps.resolve.outputs.published == 'true'
        run: bun scripts/private-linux-release.ts publish
